[package]
name = "pinza"
version = "0.1.0"
description = "Cada captura de pantalla nueva, colgada en la línea."
edition = "2021"
rust-version = "1.82"

[lib]
name = "pinza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
